name: Build Chameleon Mod

# Runs automatically whenever you push a zip (or anything else) to the repo,
# and can also be triggered manually from the Actions tab.
"on":
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the repo (this is where your uploaded zip lives).
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Find the zip file you uploaded and extract it.
      #    Looks anywhere in the repo (skipping .git) so it doesn't matter
      #    if the zip sits at the root or in a subfolder.
      - name: Locate and extract mod zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for a .zip file in the repository..."
          ALL_ZIPS="$(find . -path ./.git -prune -o -iname '*.zip' -print)"
          ZIP_COUNT="$(printf '%s\n' "${ALL_ZIPS}" | grep -c . || true)"

          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "::error::No .zip file found in the repository. Upload the mod zip to the repo and re-run."
            exit 1
          fi

          ZIP_PATH="$(printf '%s\n' "${ALL_ZIPS}" | head -n 1)"

          if [ "${ZIP_COUNT}" -gt 1 ]; then
            echo "::warning::Found ${ZIP_COUNT} zip files - using the first one: ${ZIP_PATH}"
          fi

          echo "Found zip: ${ZIP_PATH}"

          EXTRACT_DIR="$(mktemp -d "${RUNNER_TEMP}/mod-src-XXXXXX")"
          unzip -q "${ZIP_PATH}" -d "${EXTRACT_DIR}"

          echo "Extracted to: ${EXTRACT_DIR}"

          # 3) The zip might contain the project directly at its root, or
          #    wrapped in a single subfolder (e.g. "chameleon-mod/"). Either
          #    way, find the directory that actually contains build.gradle
          #    and use THAT as the project root for every later step.
          BUILD_GRADLE_PATH="$(find "${EXTRACT_DIR}" -maxdepth 4 -iname 'build.gradle' -print | head -n 1)"

          if [ -z "${BUILD_GRADLE_PATH}" ]; then
            echo "::error::No build.gradle found anywhere inside the extracted zip. Check that the zip contains a valid Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${BUILD_GRADLE_PATH}")"
          echo "Project root detected at: ${PROJECT_DIR}"

          # Make this path available to every later step in this job.
          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"

      # 4) Fabric Loom 1.6.x needs Java 21 to run Gradle itself, even though
      #    the mod's compiled bytecode targets Java 17 (already configured
      #    inside build.gradle via "options.release = 17").
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5) Set up Gradle. No Gradle wrapper is required in the zip - this
      #    downloads and caches a known-good Gradle version directly.
      #    Gradle 8.9 satisfies Fabric Loom 1.6's minimum requirement of
      #    Gradle 8.6+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6) Build the mod. Loom's "build" task compiles, remaps, and packages
      #    the final mod jar automatically - nothing else to configure.
      - name: Build mod with Gradle
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle build --no-daemon --stacktrace

      # 7) Upload the finished jar(s) so you can download them from the
      #    workflow run's "Summary" page once it finishes.
      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-mod-jar
          path: ${{ steps.extract.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
