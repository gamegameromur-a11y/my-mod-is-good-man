name: Build Chameleon Mod
"on":
  push:
    branches: [ "**" ]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract mod zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ALL_ZIPS="$(find . -path ./.git -prune -o -iname '*.zip' -print)"
          ZIP_COUNT="$(printf '%s\n' "${ALL_ZIPS}" | grep -c . || true)"
          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "::error::No .zip file found."
            exit 1
          fi
          ZIP_PATH="$(printf '%s\n' "${ALL_ZIPS}" | head -n 1)"
          EXTRACT_DIR="$(mktemp -d "${RUNNER_TEMP}/mod-src-XXXXXX")"
          unzip -q "${ZIP_PATH}" -d "${EXTRACT_DIR}"
          BUILD_GRADLE_PATH="$(find "${EXTRACT_DIR}" -maxdepth 4 -iname 'build.gradle' -print | head -n 1)"
          if [ -z "${BUILD_GRADLE_PATH}" ]; then
            echo "::error::No build.gradle found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${BUILD_GRADLE_PATH}")"
          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Patch source files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/src/main/java/com/chameleon"

          # Patch 1: NbtList.getSize() -> size()
          sed -i 's/\.getEnchantments()\.getSize()/.getEnchantments().size()/g' "$SRC/role/RoleEffects.java"
          echo "Patch 1 done"

          # Patch 2: remove handleFallDamage mixin block from PlayerEntityMixin
          echo "" | base64 -d > /tmp/patch2.py
          python3 /tmp/patch2.py "$SRC/mixin/PlayerEntityMixin.java"

          # Patch 3: delete PlayerModelMixin (broken @Shadow fields in 1.20.1)
          # and remove it from chameleon.mixins.json
          echo "" | base64 -d > /tmp/patch3.py
          python3 /tmp/patch3.py "$PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build mod with Gradle
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-mod-jar
          path: ${{ steps.extract.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
