name: Build Chameleon Mod
"on":
  push:
    branches: [ "**" ]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract mod zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for a .zip file in the repository..."
          ALL_ZIPS="$(find . -path ./.git -prune -o -iname '*.zip' -print)"
          ZIP_COUNT="$(printf '%s\n' "${ALL_ZIPS}" | grep -c . || true)"
          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "::error::No .zip file found in the repository. Upload the mod zip to the repo and re-run."
            exit 1
          fi
          ZIP_PATH="$(printf '%s\n' "${ALL_ZIPS}" | head -n 1)"
          if [ "${ZIP_COUNT}" -gt 1 ]; then
            echo "::warning::Found ${ZIP_COUNT} zip files - using the first one: ${ZIP_PATH}"
          fi
          echo "Found zip: ${ZIP_PATH}"
          EXTRACT_DIR="$(mktemp -d "${RUNNER_TEMP}/mod-src-XXXXXX")"
          unzip -q "${ZIP_PATH}" -d "${EXTRACT_DIR}"
          echo "Extracted to: ${EXTRACT_DIR}"
          BUILD_GRADLE_PATH="$(find "${EXTRACT_DIR}" -maxdepth 4 -iname 'build.gradle' -print | head -n 1)"
          if [ -z "${BUILD_GRADLE_PATH}" ]; then
            echo "::error::No build.gradle found anywhere inside the extracted zip."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${BUILD_GRADLE_PATH}")"
          echo "Project root detected at: ${PROJECT_DIR}"
          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"

      # Patch 1: NbtList uses size(), not getSize()
      - name: Patch RoleEffects.java
        shell: bash
        run: |
          FILE="${{ steps.extract.outputs.project_dir }}/src/main/java/com/chameleon/role/RoleEffects.java"
          sed -i 's/\.getEnchantments()\.getSize()/.getEnchantments().size()/g' "$FILE"
          echo "Patched: $(grep -n 'getEnchantments' "$FILE")"

      # Patch 2: handleFallDamage does not exist on ServerPlayerEntity in 1.20.1.
      # Fall damage is already blocked by the damage() mixin above (arrow-only guard),
      # so this secondary mixin is redundant and causes a crash. Remove it entirely.
      - name: Patch PlayerEntityMixin.java - remove broken handleFallDamage mixin
        shell: bash
        run: |
          FILE="${{ steps.extract.outputs.project_dir }}/src/main/java/com/chameleon/mixin/PlayerEntityMixin.java"
          python3 - "$FILE" <<'PYEOF'
          import re, sys
          src = open(sys.argv[1]).read()
          # Remove the comment block + @Inject method for handleFallDamage
          # Remove the @Inject method block
          src = re.sub(
              r'\n    // -- Fall damage secondary guard.*?}\n',
              '',
              src,
              flags=re.DOTALL
          )
          # Remove the stale javadoc line referencing handleFallDamage
          src = re.sub(r' \*      handleFallDamage.*?\n', '', src)
          open(sys.argv[1], 'w').write(src)
          print("Patched: handleFallDamage mixin removed")
          PYEOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mod with Gradle
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-mod-jar
          path: ${{ steps.extract.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
