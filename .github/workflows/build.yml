name: Build Chameleon Mod
"on":
  push:
    branches: [ "**" ]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract mod zip
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ALL_ZIPS="$(find . -path ./.git -prune -o -iname '*.zip' -print)"
          ZIP_COUNT="$(printf '%s\n' "${ALL_ZIPS}" | grep -c . || true)"
          if [ "${ZIP_COUNT}" -eq 0 ]; then
            echo "::error::No .zip file found."
            exit 1
          fi
          ZIP_PATH="$(printf '%s\n' "${ALL_ZIPS}" | head -n 1)"
          EXTRACT_DIR="$(mktemp -d "${RUNNER_TEMP}/mod-src-XXXXXX")"
          unzip -q "${ZIP_PATH}" -d "${EXTRACT_DIR}"
          BUILD_GRADLE_PATH="$(find "${EXTRACT_DIR}" -maxdepth 4 -iname 'build.gradle' -print | head -n 1)"
          if [ -z "${BUILD_GRADLE_PATH}" ]; then
            echo "::error::No build.gradle found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${BUILD_GRADLE_PATH}")"
          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Patch source files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/src/main/java/com/chameleon"

          # Patch 1: NbtList.getSize() -> size()
          F1="$SRC/role/RoleEffects.java"
          sed -i 's/\.getEnchantments()\.getSize()/.getEnchantments().size()/g' "$F1"
          echo "Patch 1 done: $(grep -n 'getEnchantments' "$F1")"

          # Patch 2: Remove the broken handleFallDamage @Inject block
          F2="$SRC/mixin/PlayerEntityMixin.java"
          python3 -c "
import sys
lines = open('$F2').readlines()
start = next((i for i,l in enumerate(lines) if '// -- Fall damage secondary guard' in l), None)
if start is None:
    print('Patch 2: block not found, skipping')
    sys.exit(0)
end = None
depth = 0
in_method = False
for i in range(start, len(lines)):
    l = lines[i]
    if '@Inject' in l and 'handleFallDamage' in l:
        in_method = True
    if in_method:
        depth += l.count('{') - l.count('}')
        if depth <= 0 and any('{' in x for x in lines[start:i+1]):
            end = i
            break
if end is None:
    print('Patch 2: end not found, skipping')
    sys.exit(0)
print(f'Patch 2: removing lines {start+1}-{end+1}')
open('$F2','w').writelines(lines[:start] + lines[end+1:])
print('Patch 2 done')
"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build mod with Gradle
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-mod-jar
          path: ${{ steps.extract.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
